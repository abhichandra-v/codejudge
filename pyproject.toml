[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codejudge"
version = "0.1.0"
description = "A sandboxed harness for evaluating LLM-written Python code against hidden test suites."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "codejudge" }]
keywords = ["llm", "evaluation", "benchmark", "code-generation", "sandbox"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]
dependencies = []  # runtime uses only the standard library

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
codejudge = "codejudge.cli:main"

[tool.setuptools.packages.find]
include = ["codejudge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
